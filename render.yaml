services:
  - type: web
    name: gridwise-bup-2026
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LLM_TIMEOUT_SECONDS
        value: "12"
      - key: LLM_MAX_ATTEMPTS
        value: "2"
